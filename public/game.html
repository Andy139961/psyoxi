<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>对战 · PSYoxI</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page game-page">
    <div class="game-top">
      <a href="lobby.html" class="brand small">PSYoxI</a>
      <a href="index.html" class="text-btn" style="font-size:13px;">返回首页</a>
      <div class="turn-info">
        <span id="turn-player" class="turn-name">—</span>
        <span id="turn-actions" class="actions-pill">动作 3/3</span>
      </div>
      <div class="my-info">
        <span class="chip money">💰 <b id="my-money">0</b></span>
        <span class="chip points">⭐ <b id="my-points">0</b> 分</span>
        <span class="chip prov">🏯 <b id="my-prov">0</b> 省</span>
        <span class="chip sold">⚔ <b id="my-sold">0</b> 兵</span>
      </div>
      <button id="btn-settle" class="big-btn small hidden">结算</button>
      <button id="btn-leave-game" class="big-btn small">退出</button>
    </div>

    <div class="game-main">
      <div class="map-wrap">
        <canvas id="map"></canvas>
        <div class="map-tip">滚轮缩放 · 拖拽平移（不计入动作）</div>
      </div>

      <aside class="side">
        <div id="detail" class="detail">
          <p class="muted">点击地图上的省份查看详情。</p>
        </div>
        <div class="actions">
          <button class="act-btn" data-act="business">做生意 +💰</button>
          <button class="act-btn" data-act="tax">收税 +💰</button>
          <button class="act-btn" data-act="buy">买士兵</button>
          <button class="act-btn" data-act="move">调动士兵</button>
          <button class="act-btn" data-act="exchange">换积分 ¥1万→3</button>
          <button class="act-btn danger" data-act="attack">进攻 / 占领</button>
          <button class="act-btn end" data-act="endTurn">结束回合</button>
        </div>
        <div class="log-box">
          <div class="log-title">战报</div>
          <div id="log" class="log"></div>
        </div>
      </aside>
    </div>
  </div>

  <!-- 弹窗 -->
  <div id="modal" class="modal hidden">
    <div class="modal-box">
      <div id="modal-content"></div>
      <button id="modal-close" class="text-btn">关闭</button>
    </div>
  </div>

  <!-- 弹幕层（消息飘过屏幕） -->
  <div id="danmaku-layer"></div>

  <!-- 聊天框 -->
  <div id="chat-history"></div>
  <form id="chat-bar" autocomplete="off">
    <input id="chat-input" type="text" maxlength="120" placeholder="发条消息，飘过全场…" />
    <button type="submit" class="big-btn small">发送</button>
  </form>

  <div id="toast" class="toast hidden"></div>

  <script src="common.js"></script>
  <script src="game.js"></script>
</body>
</html>
