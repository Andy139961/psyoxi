<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>房间大厅 · PSYoxI</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page">
    <div class="topbar">
      <a href="index.html" class="brand">PSYoxI</a>
      <span class="crumb">房间大厅</span>
    </div>

    <div class="lobby-wrap">
      <!-- 建房 / 选房 -->
      <div id="join-card" class="card">
        <h2>进入房间</h2>
        <div class="tabs">
          <button id="tab-create" class="tab active">开房间</button>
          <button id="tab-join" class="tab">选房间</button>
        </div>

        <div id="panel-create" class="panel">
          <label>你的昵称
            <input id="create-name" type="text" maxlength="12" placeholder="如：秦王" />
          </label>
          <label>人数上限（2~7）
            <select id="create-max">
              <option>2</option><option>3</option><option>4</option>
              <option>5</option><option>6</option><option selected>7</option>
            </select>
          </label>
          <button id="btn-create" class="big-btn">创建并开房</button>
        </div>

        <div id="panel-joinroom" class="panel hidden">
          <label>你的昵称
            <input id="join-name" type="text" maxlength="12" placeholder="如：楚王" />
          </label>
          <label>房间号（8 位）
            <input id="join-room" type="text" maxlength="8" inputmode="numeric" placeholder="例如 12345678" />
          </label>
          <button id="btn-join" class="big-btn">加入房间</button>
        </div>
        <a href="index.html" class="text-btn">返回首页</a>
      </div>

      <!-- 大厅 -->
      <div id="lobby-card" class="card hidden">
        <h2>房间大厅</h2>
        <div class="room-id">房间号：<span id="lobby-roomid">------</span>
          <button id="btn-copy" class="mini-btn">复制</button>
        </div>
        <div id="lobby-players" class="player-list"></div>
        <p id="lobby-tip" class="hint"></p>
        <div id="lobby-count" class="countdown hidden"></div>
        <button id="btn-begin" class="big-btn hidden">开始对战</button>
        <button id="btn-leave" class="text-btn">离开房间</button>
      </div>
    </div>
  </div>

  <!-- 建房成功弹窗：醒目展示房间号 -->
  <div id="room-pop" class="modal hidden">
    <div class="modal-box center">
      <h3>房间已创建！</h3>
      <p class="muted">把 8 位房间号发给好友，让他们在「选房间」里输入加入：</p>
      <div id="pop-roomnum" class="room-num">--------</div>
      <div class="row"><button id="pop-copy" class="big-btn small">复制房间号</button></div>
      <button id="pop-close" class="text-btn">知道了</button>
    </div>
  </div>

  <!-- 检测到旧对局：询问是否继续 -->
  <div id="resume-pop" class="modal hidden">
    <div class="modal-box center">
      <h3>检测到进行中的对局</h3>
      <p class="muted">你之前在房间 <span id="resume-roomnum">--------</span> 的对局还未结束，要继续吗？</p>
      <div class="row" style="justify-content:center;">
        <button id="resume-continue" class="big-btn small">继续对局</button>
        <button id="resume-leave" class="text-btn">离开，开新局</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="common.js"></script>
  <script src="lobby.js"></script>
</body>
</html>
