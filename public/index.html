<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PSYoxI · 跨网联机打仗游戏</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page center-page">
    <div class="start-box">
      <h1>PSYoxI</h1>
      <p class="subtitle">跨网联机 · 省 / 郡 / 县 占领战争</p>
      <button id="btn-start" class="big-btn">开始游戏</button>
      <p class="hint">2~7 人联机对战 · 建房获取 8 位房号 · 选房输入房号加入</p>
      <p class="hint small">提示：建房 / 选房会进入「房间大厅」页，开局后进入「对战」页。</p>
    </div>
  </div>

  <script src="common.js"></script>
  <script>
    // 首页始终先展示「开始游戏」页；点击后再进入大厅（大厅会自动 rejoin 恢复对局）
    $('btn-start').onclick = () => { location.href = 'lobby.html'; };
  </script>
</body>
</html>
